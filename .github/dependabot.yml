# Mises à jour de sécurité automatiques : Dependabot propose une pull request quand une
# bibliothèque Android/Gradle ou une action GitHub a une nouvelle version.
version: 2
updates:
  - package-ecosystem: gradle
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
