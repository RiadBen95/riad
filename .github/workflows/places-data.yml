name: Données des lieux

# Génère la base des lieux remarquables (Wikidata), publiée en ligne dans data/places/
# et téléchargée par l'application zone par zone.
on:
  workflow_dispatch:
  push:
    paths:
      - tools/build_places.py
  schedule:
    - cron: "17 3 * * 1"   # chaque lundi : données à jour

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Interroger Wikidata
        run: python tools/build_places.py data/places
      - name: Enregistrer dans le dépôt
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/places
          if git diff --cached --quiet; then echo "Aucun changement"; exit 0; fi
          git commit -m "Mettre à jour la base des lieux (Wikidata)"
          # La branche a pu avancer pendant la génération : on se replace dessus avant d'envoyer.
          git pull --rebase origin ${{ github.ref_name }}
          git push origin HEAD:${{ github.ref_name }}
