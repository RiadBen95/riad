name: Données des lieux

# Génère la base des lieux remarquables (Wikidata), publiée en ligne dans data/places/
# et téléchargée par l'application zone par zone.
on:
  workflow_dispatch:
  push:
    paths:
      - tools/build_places.py
  schedule:
    - cron: "17 3 * * 1"   # chaque lundi : données à jour

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # enregistre data/places dans le dépôt
    timeout-minutes: 60
    steps:
      # Action épinglée par empreinte ; Python 3 est déjà installé sur la machine (pas d'action tierce).
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Interroger Wikidata
        run: python3 tools/build_places.py data/places
      - name: Enregistrer dans le dépôt
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/places
          if git diff --cached --quiet; then echo "Aucun changement"; exit 0; fi
          git commit -m "Mettre à jour la base des lieux (Wikidata)"
          # La branche a pu avancer pendant la génération : on se replace dessus avant d'envoyer.
          git pull --rebase origin ${{ github.ref_name }}
          git push origin HEAD:${{ github.ref_name }}
