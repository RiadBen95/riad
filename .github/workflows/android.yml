name: Android build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Tests unitaires
        run: ./gradlew testDebugUnitTest
      - name: Construire l'APK
        run: |
          ./gradlew assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk accordeur-guitare.apk
      - uses: actions/upload-artifact@v4
        with:
          name: accordeur-guitare-apk
          path: accordeur-guitare.apk
      # Publie l'APK dans une Release : lien direct
      # https://github.com/<owner>/<repo>/releases/latest/download/accordeur-guitare.apk
      - name: Publier la release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Accordeur Guitare (build ${{ github.run_number }})
          body: |
            APK de l'accordeur de guitare, compilé depuis ${{ github.sha }}.
            Téléchargez `accordeur-guitare.apk` et ouvrez-le sur votre téléphone Android (8.0 minimum).
          files: accordeur-guitare.apk
          make_latest: true
