name: Android build

on:
  push:
  pull_request:
  workflow_dispatch:

# Droits minimaux par défaut : seule l'étape de publication peut écrire (job « publish »).
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Actions épinglées par empreinte (et non par étiquette) : une étiquette peut être déplacée.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: 17
      # Vérifie aussi que gradle-wrapper.jar est un fichier officiel (validate-wrappers).
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          validate-wrappers: true
      - name: Tests unitaires
        run: ./gradlew testDebugUnitTest
      - name: Accordeur (debug)
        run: |
          ./gradlew :app:assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk accordeur-guitare.apk
      # Envolée : version « release » signée si la clé privée est dans les secrets GitHub (ENVOLEE_*),
      # sinon version debug signée avec la clé fixe du dépôt.
      - name: Envolée
        env:
          KEYSTORE_BASE64: ${{ secrets.ENVOLEE_KEYSTORE_BASE64 }}
          ENVOLEE_KEYSTORE_PASSWORD: ${{ secrets.ENVOLEE_KEYSTORE_PASSWORD }}
          ENVOLEE_KEY_ALIAS: ${{ secrets.ENVOLEE_KEY_ALIAS }}
          ENVOLEE_KEY_PASSWORD: ${{ secrets.ENVOLEE_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            # Pas de clé privée : version debug signée avec la clé fixe du dépôt (comme avant).
            ./gradlew :voyage:assembleDebug
            cp voyage/build/outputs/apk/debug/voyage-debug.apk envolee.apk
            cp envolee.apk voyage-malin.apk
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/envolee.jks"
          ENVOLEE_KEYSTORE_FILE="$RUNNER_TEMP/envolee.jks" ./gradlew :voyage:assembleRelease
          rm -f "$RUNNER_TEMP/envolee.jks"
          cp voyage/build/outputs/apk/release/voyage-release.apk envolee.apk
          # Ancien nom, gardé pour que les anciens liens continuent de marcher.
          cp envolee.apk voyage-malin.apk
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: apk
          path: |
            accordeur-guitare.apk
            envolee.apk
            voyage-malin.apk
          if-no-files-found: ignore

  # Publication : seulement depuis la branche principale ou la branche de développement,
  # jamais depuis une pull request, et seulement si l'APK signé existe.
  publish:
    needs: build
    if: >-
      github.event_name != 'pull_request' &&
      (github.ref_name == github.event.repository.default_branch || github.ref_name == 'ccr-a5448643-kldk3d')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      # Outil officiel « gh » (préinstallé) plutôt qu'une action tierce : moins de code extérieur.
      - name: Récupérer les APK
        run: gh run download "${{ github.run_id }}" --name apk --dir out
      - name: Publier la release
        run: |
          if [ ! -f out/envolee.apk ]; then echo "Pas d'APK : rien à publier."; exit 0; fi
          # Liens directs : https://github.com/<owner>/<repo>/releases/latest/download/envolee.apk
          gh release create "build-${{ github.run_number }}" out/*.apk \
            --target "${{ github.sha }}" --latest \
            --title "Applications Android (build ${{ github.run_number }})" \
            --notes "Compilé depuis ${{ github.sha }}. envolee.apk : Envolée ; accordeur-guitare.apk : accordeur de guitare. Android 8.0 minimum."
