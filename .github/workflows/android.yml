name: Android build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Tests unitaires
        run: ./gradlew testDebugUnitTest
      - name: Construire les APK
        run: |
          ./gradlew assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk accordeur-guitare.apk
          cp voyage/build/outputs/apk/debug/voyage-debug.apk envolee.apk
      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: |
            accordeur-guitare.apk
            envolee.apk
      # Publie les APK dans une Release : liens directs
      # https://github.com/<owner>/<repo>/releases/latest/download/accordeur-guitare.apk
      # https://github.com/<owner>/<repo>/releases/latest/download/envolee.apk
      - name: Publier la release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Applications Android (build ${{ github.run_number }})
          body: |
            Compilé depuis ${{ github.sha }}.
            - `envolee.apk` : Envolée, vols et sorties au meilleur prix
            - `accordeur-guitare.apk` : accordeur de guitare
            Téléchargez l'APK voulu et ouvrez-le sur votre téléphone Android (8.0 minimum).
          files: |
            accordeur-guitare.apk
            envolee.apk
          make_latest: true
